<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Phoenix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Phoenix</h1>
      <span id="status" class="status">Connecting...</span>
    </header>

    <div id="chat" class="chat">
      <div class="message system">Waking up...</div>
    </div>

    <div class="input-area">
      <textarea id="userInput" placeholder="Talk to Claude..." rows="2"></textarea>
      <div class="buttons">
        <button id="sendBtn" class="btn primary">Send</button>
        <button id="pageBtn" class="btn secondary">Read Page</button>
      </div>
    </div>

    <footer>
      <span id="pageInfo">No page loaded</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
